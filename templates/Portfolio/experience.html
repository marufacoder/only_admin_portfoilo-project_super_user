{% extends "base.html" %}{% block content %}<h1>Work Experience</h1>{% for x in experiences %}<div class="card p-4 mb-3"><h4>{{ x.position }}</h4><h6 class="text-primary">{{ x.company_name }}</h6><small>{{ x.start_date }} – {{ x.end_date|default:"Present" }}</small><p>{{ x.description }}</p></div>{% empty %}<p>No experience listed.</p>{% endfor %}{% endblock %}
